# =============================================================================
# afmkit — single-molecule force spectroscopy analysis
# Modern Python toolkit to replace Igor Pro workflows.
# =============================================================================

[build-system]
requires = ["hatchling>=1.18", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "afmkit"
version = "0.6.0"
description = "Modern Python toolkit for single-molecule force spectroscopy data analysis."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "afmkit developers", email = "dev@example.com"},
]
keywords = [
    "afm",
    "force-spectroscopy",
    "single-molecule",
    "wlc",
    "biophysics",
    "jpk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# Hard runtime dependencies — kept minimal so the core stays light.
dependencies = [
    # numpy<2.4 because 2.5+ stubs use PEP 696 TypeVar-default syntax
    # which mypy cannot parse on the Python 3.12 baseline of our CI matrix.
    "numpy>=1.26,<2.4",
    "scipy>=1.11",
    "xarray>=2024.1",
    "pandas>=2.1",
    "lmfit>=1.3",
    "pydantic>=2.5",
    # pluggy is the plugin hook manager that ``src/afmkit.plugins``
    # imports unconditionally. It used to be pulled in only as a
    # transitive dep of pytest, which meant a bare ``pip install
    # afmkit`` (no dev / test extras) would still ``import afmkit``
    # but a ``import pluggy`` at module load would have to come
    # from somewhere else. Make it explicit so the runtime
    # install path is self-contained.
    "pluggy>=1.5",
    "typer>=0.12",
    "rich>=13.7",
    "loguru>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# HDF5 is the native storage format, but optional to keep pure-Python installs light.
io = [
    "h5py>=3.10",
    "hdf5plugin>=4.3",
]
# Parquet export support. The exporter prefers pyarrow, falls back to
# fastparquet, and raises ImportError if neither is installed. The
# pyarrow backend is shipped with type stubs, so installing it
# silences the mypy strict-mode "import-not-found" complaint on the
# `import pyarrow` in afmkit.io.exporters.
parquet = [
    "pyarrow>=14",
]
# Legacy Igor Pro binary wave support. The PyPI release is at 0.3
# (the 0.4 series exists in the [dev] extra aspirationally but isn't
# on PyPI yet). Pin to the version that actually installs.
igor = [
    "igor>=0.3",
]
# Matlab .mat round-trip (uses hdf5 backend for v7.3).
matlab = [
    "scipy>=1.11",  # scipy.io.savemat — already in runtime, kept here for explicitness
]
# Static plotting (matplotlib) for paper figures.
plot = [
    "matplotlib>=3.8",
]
# Interactive terminal UI (TUI) — a Textual app that runs over SSH
# without an X server. See ``afmkit.presentation.gui.app.AFMkitApp``.
# The minimum version is intentionally loose to allow whichever
# Textual release is current in the lab's pip index.
gui = [
    "textual>=0.50",
]
# Native terminal image rendering for the TUI plot panel (Sixel /
# Kitty / iTerm graphics via the ``textual-image`` library).
# Separate from ``[plot]`` so the v0.4 half-block default keeps
# its zero-dependency contract: a minimal ``[plot]`` install
# never needs ``textual-image``.  The plot widget auto-detects
# terminal capability and only uses this path when both the
# package is installed and the terminal supports a native
# image protocol.
plot-native = [
    "textual-image>=0.12",
]
# Documentation build.
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "jupyter>=1.0",
    "nbconvert>=7.13",
]
# Convenience: install everything an end-user might want.
all = [
    "afmkit[io,parquet,igor,matlab,plot,plot-native,gui]",
]
# Developer / CI dependencies.
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    # Pin ruff minor-version range so local + CI format identically.
    # Bump the upper bound together with the CI pin in .github/workflows/ci.yml.
    "ruff>=0.4.10,<0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipython>=8.20",
    "ipykernel>=6.29",
    # h5py is needed for the io module's top-level imports (HDF5Store is
    # re-exported there). Without this, the dev / CI test matrix fails on
    # the import chain. The [io] extra is still respected for end users
    # who want a minimal install.
    "h5py>=3.10",
    # pyarrow is the preferred Parquet backend for to_parquet; the
    # test_exporters module exercises it directly. Install it here so
    # the CI test matrix has the engine available and mypy --strict
    # can resolve the `import pyarrow` in afmkit.io.exporters.
    "pyarrow>=14",
    # matplotlib + pillow are the deps of the v0.3 plot widget
    # (afmkit.presentation.gui.plot). Install here so the CI test
    # matrix exercises test_plot.py end-to-end and mypy --strict can
    # resolve `import matplotlib` / `import PIL` in plot.py.
    "matplotlib>=3.8",
    "pillow>=10.0",
    # textual is the v0.2 / v0.3 TUI runtime; the v0.3 work wired
    # AFMkitApp + plot + peak-review together and the test matrix
    # needs the runtime to be importable.
    "textual>=0.50",
    # The Igor .ibw reader delegates to the `igor` PyPI package; the
    # dev test matrix runs test_igor_ibw.py on a fresh install.
    # Note: the latest release on PyPI is 0.3 (the 0.4 series
    # mentioned in the [igor] extra is aspirational; the upstream
    # save() is still NotImplementedError there too). Pin to >=0.3
    # to match the version that's actually installable.
    "igor>=0.3",
    # ``textual-image`` is the v0.6+ native terminal image renderable
    # for the plot widget (the ``[plot-native]`` extra). Install it
    # here so the CI test matrix exercises TestNativeImageRenderable
    # end-to-end and mypy --strict can resolve
    # ``import textual_image`` in plot.py.  End users get the
    # native path via the ``[plot-native]`` extra; the half-block
    # fallback path (the v0.4 default) is the zero-dep contract.
    # Floor at 0.12 because 0.13+ require Python >= 3.12; the CI
    # test matrix still covers py3.11, so the dev install must
    # work on py3.11 too.
    "textual-image>=0.12",
]

[project.urls]
Homepage = "https://github.com/linjiema/afmkit"
Documentation = "https://afmkit.readthedocs.io"
Repository = "https://github.com/linjiema/afmkit"
Issues = "https://github.com/linjiema/afmkit/issues"
Changelog = "https://github.com/linjiema/afmkit/blob/main/CHANGELOG.md"

# Entry point: `afmkit` becomes a shell command.
[project.scripts]
afmkit = "afmkit.presentation.cli:app"

# Third-party plugin entry points. Plugin authors add to this group from
# their own pyproject.toml; afmkit auto-discovers them via pluggy.
[project.entry-points."afmkit.loaders"]
# Built-in loaders register themselves programmatically; this section is
# intentionally empty so third-party packages can be the only contributors.

[project.entry-points."afmkit.models"]
# FJC is the first v0.3 plugin entry. pluggy auto-discovers this
# at afmkit.plugins.PM time. The in-tree MODEL_REGISTRY is kept in
# sync by the explicit "fjc": FJCModel entry above so that
# `from afmkit.models import get_model("fjc")` works without
# requiring the entry-point mechanism to fire.
fjc = "afmkit.models.fjc:FJCModel"

# =============================================================================
# Hatchling build configuration
# =============================================================================

[tool.hatch.build.targets.wheel]
packages = ["src/afmkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/afmkit",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

# =============================================================================
# Ruff (linter + formatter)
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Conservative but strict starter set. We can loosen as needed.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "PTH",   # use pathlib
    "RET",   # flake8-return
    "TID",   # tidy imports
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line length (we set line-length globally)
    "B008",  # function calls in defaults — common in pydantic/Typer
    "RUF012", # mutable class attributes — common for class-level registries
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use physics-style single-letter variable names
# (`F`, `L`, `p`, …) and longer assertion expressions. The asserts are
# essential to test code. The em-dash characters in physics docstrings
# are typographically correct.
"tests/**/*.py" = [
    "S101",  # asserts
    "N802",  # long test function names
    "N803",  # uppercase argument names (L, p are physics symbols)
    "N806",  # uppercase variable names in tests (F, L, p in formulas)
    "RUF002", # en-dash in docstrings
    "RUF003", # en-dash in comments
    "SIM300", # Yoda conditions (math expressions are easier to read forward)
]
# The polymer models use single-letter physics symbols by convention
# and em-dashes are typographically correct in physical-unit ranges.
"src/afmkit/models/**/*.py" = [
    "N803",   # `L` is the canonical symbol for contour length
    "RUF002", # en-dash in docstrings
    "RUF003", # en-dash in comments
]
"docs/**/*.py" = ["INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# mypy
# =============================================================================

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "igor.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# h5py ships without type stubs (no py.typed marker) — fall back to
# dynamic typing for the IO layer that touches it. The hdf5_store
# module is small and well-tested, so the loss of static guarantees
# is acceptable.
module = "h5py.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pandas ships type hints in source but they require the ``pandas-stubs``
# companion package, which is not part of the runtime dependencies
# (kept optional to keep the install footprint small). Treat as
# untyped for static analysis; the IO layer is well-tested at runtime.
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy.io.savemat / loadmat is exercised by :func:`to_mat`. The
# ``scipy-stubs`` package is not a runtime dependency; fall back to
# dynamic typing for the small surface area we touch.
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lmfit is the fitting backend; it ships without a ``py.typed`` marker,
# so mypy falls back to dynamic typing for the small surface area the
# fitting layer touches (``Model``, ``Parameters``, ``ModelResult``).
module = "lmfit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Textual is an optional [gui] extra; it ships partial type hints but
# we don't ship stubs for the small surface area the TUI uses
# (App, ModalScreen, DataTable, Input, Footer, Header, Container,
# Vertical). The runtime check `pytest.importorskip("textual")`
# keeps it out of the default test path anyway. We also turn off
# ``misc`` for textual because its runtime classes surface as
# ``Any`` in mypy's view (the partial py.typed marker does not
# expose ``App`` / ``ModalScreen`` as a subclassable class) and
# the resulting "Class cannot subclass value of type Any" is a
# false positive that does not actually flag a real bug.
module = "textual.*"
ignore_missing_imports = true
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# matplotlib + pillow ship without type stubs in our test matrix.
# The v0.3 plot widget only uses matplotlib.pyplot.Agg and Pillow's
# Image / ImageDraw — the surface is small enough that dynamic
# typing is fine.
module = ["matplotlib.*", "matplotlib.pyplot", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The TUI is implemented entirely in terms of textual runtime classes
# (App, ModalScreen, DataTable, ...). The textual package ships
# partial stubs and different mypy versions disagree on whether
# ``App`` / ``ModalScreen`` are subclassable; some versions surface
# the names as ``Any`` and then refuse a subclass with a "Class
# cannot subclass value of type Any" [misc] false positive that does
# not actually flag a real bug. Turn off ``misc`` for the whole gui
# submodule so the rest of afmkit stays mypy --strict without the
# TUI forcing a noise-floor of false positives.
module = "afmkit.presentation.gui.*"
disable_error_code = ["misc"]

# =============================================================================
# pytest
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "--doctest-glob='*.rst'",
]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    # Third-party warnings to ignore — be conservative.
    "ignore::DeprecationWarning:igor",
    "ignore::DeprecationWarning:xarray.*",
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
branch = true
source = ["afmkit"]
omit = [
    "src/afmkit/_version.py",
    "src/afmkit/presentation/gui/*",  # GUI tested separately
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 70  # raise as we approach v1.0

# =============================================================================
# Docs (mkdocs)
# =============================================================================

[tool.mkdocs]
# Real mkdocs.yml lives at the repo root; this stub keeps the package
# metadata self-contained for `python -m afmkit.docs`.
site_name = "afmkit"
