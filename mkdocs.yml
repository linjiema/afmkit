site_name: afmkit
site_description: Modern Python toolkit for single-molecule force spectroscopy
site_url: https://linjiema.github.io/afmkit/
repo_url: https://github.com/linjiema/afmkit
repo_name: linjiema/afmkit
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            docstring_section_style: table
            merge_init_into_class: false
            inherited_members: false
  - autorefs

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Migration from Igor Pro: migration.md
  - Tutorials:
      - tutorials/index.md
  - API reference:
      - api/index.md
      - api/curve.md
  - Contributing: contributing.md
  - Team & agent workflow: team.md
  - Roadmap:
      - v0.3: v0.3-roadmap.md
  - Changelog: https://github.com/linjiema/afmkit/blob/main/CHANGELOG.md
