name: CI

# Fire on push and PR to BOTH `main` (release PRs / hotfix merges)
# and `develop` (daily integration). The previous `[main]` only config
# meant PRs targeting `develop` (the new workflow's daily integration
# branch, per `docs/git-workflow.md`) had no CI feedback at all, so
# the release-checklist's "CI gates" step was a no-op for every PR
# except the final release PR. This is the prerequisite for the new
# workflow to actually gate merges.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs of the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.4.10
      - run: ruff check src tests
      - run: ruff format --check src tests

  pre-commit:
    name: Pre-commit (all hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # ``pre-commit/action`` installs the pinned hook versions from
      # ``.pre-commit-config.yaml`` into an isolated cache and runs them
      # against every tracked file. This is the mirror of what
      # ``.venv/bin/python -m pre_commit run --all-files`` does locally
      # — the same hooks, the same pinned revisions, the same exit codes.
      # The CI run is non-mutating: hooks in ``.pre-commit-config.yaml``
      # deliberately do NOT carry ``--fix`` so a dirty push fails loud
      # here instead of getting silently rewritten.
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy src/afmkit

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          # Only install the core + dev extras here. Optional plugins
          # (igor, hdf5plugin, …) live under their own `[extras]` job below
          # so a failure there does not block the core CI.
          python -m pip install -e ".[dev]"
      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -n auto --cov=afmkit --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  extras:
    name: Optional extras (smoke install)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    # Verify each optional extra installs cleanly. A failure here is
    # non-blocking for the main build — extras may need platform-specific
    # wheels or build tools that we don't require for the core package.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        extra: ["io", "igor", "plot", "matlab"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install [${{ matrix.extra }}]
        run: |
          python -m pip install -e ".[${{ matrix.extra }},dev]"
          python -c "import afmkit; print('afmkit import OK with [${{ matrix.extra }}]')"
          # Verify the extra's main package is importable too.
          case "${{ matrix.extra }}" in
            io)     python -c "import h5py"        ;;
            igor)   python -c "import igor"        ;;
            plot)   python -c "import matplotlib"  ;;
            matlab) python -c "import scipy.io"    ;;
          esac

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, pre-commit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
